name: AxionLimit Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required for actions/checkout

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 1: Automated Unit Tests (Runs on both push and workflow_dispatch)
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Unit Tests
        run: |
          cd Backend
          npm test

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 2: Deploy Multi-Container Stack to EC2 via AWS Systems Manager (SSM)
  # (Strictly gated to manual workflow_dispatch triggers only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Single EC2 Host
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Pre-Flight Check - Verify EC2 Instance State
        run: |
          echo "Checking EC2 instance status for instance: ${{ secrets.EC2_INSTANCE_ID }}..."
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "EC2 Instance state: $INSTANCE_STATE"
          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "❌ Deployment aborted: EC2 instance ${{ secrets.EC2_INSTANCE_ID }} is not running (current state: $INSTANCE_STATE)."
            echo "Please start the instance via AWS Console or CLI before running deployment."
            exit 1
          fi

      - name: Pre-Flight Check - Verify SSM Agent Connectivity
        run: |
          echo "Checking SSM Agent connectivity for instance: ${{ secrets.EC2_INSTANCE_ID }}..."
          SSM_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          echo "SSM Agent ping status: $SSM_STATUS"
          if [ "$SSM_STATUS" != "Online" ]; then
            echo "❌ Deployment aborted: SSM Agent on instance ${{ secrets.EC2_INSTANCE_ID }} is not Online (status: $SSM_STATUS)."
            echo "Ensure the instance is booted, outbound port 443 is accessible, and the amazon-ssm-agent service is running."
            exit 1
          fi

      - name: Store Production Secrets in SSM Parameter Store
        run: |
          echo "Writing MONGO_URI and JWT_SECRET securely to AWS SSM Parameter Store..."
          aws ssm put-parameter \
            --name "/axionlimit/prod/MONGO_URI" \
            --value "${{ secrets.MONGO_URI }}" \
            --type "SecureString" \
            --overwrite
          aws ssm put-parameter \
            --name "/axionlimit/prod/JWT_SECRET" \
            --value "${{ secrets.JWT_SECRET }}" \
            --type "SecureString" \
            --overwrite
          echo "✔ Secrets stored in SSM Parameter Store (values masked)."

      - name: Trigger Remote Deployment via AWS SSM Run Command
        run: |
          echo "Sending deployment script to EC2 instance: ${{ secrets.EC2_INSTANCE_ID }}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "if [ ! -d \"/opt/axionlimit/.git\" ] || ! sudo -u ubuntu -H git -C /opt/axionlimit rev-parse --is-inside-work-tree >/dev/null 2>&1; then",
              "  echo \"Bootstrapping repository in /opt/axionlimit...\"",
              "  rm -rf /opt/axionlimit",
              "  install -d -o ubuntu -g ubuntu /opt/axionlimit",
              "  sudo -u ubuntu -H git clone https://github.com/kiranmukkamula/AxionLimit.git /opt/axionlimit",
              "fi",
              "sudo -u ubuntu -H git -C /opt/axionlimit fetch origin main",
              "sudo -u ubuntu -H git -C /opt/axionlimit checkout --force '${{ github.sha }}'",
              "cd /opt/axionlimit",
              "echo \"Retrieving production secrets from AWS SSM Parameter Store...\"",
              "MONGO_URI_VAL=$(aws ssm get-parameter --name \"/axionlimit/prod/MONGO_URI\" --with-decryption --query \"Parameter.Value\" --output text)",
              "JWT_SECRET_VAL=$(aws ssm get-parameter --name \"/axionlimit/prod/JWT_SECRET\" --with-decryption --query \"Parameter.Value\" --output text)",
              "EC2_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 || echo \"\")",
              "cat <<EOF > /opt/axionlimit/.env",
              "NODE_ENV=production",
              "PORT=5000",
              "MONGO_URI=$MONGO_URI_VAL",
              "JWT_SECRET=$JWT_SECRET_VAL",
              "REDIS_URL=redis://redis:6379",
              "FRONTEND_URL=http://$EC2_IP",
              "ENABLE_DEV_LOGIN=false",
              "EC2_SERVER_NAME=EC2-Mumbai",
              "EOF",
              "chmod 600 /opt/axionlimit/.env",
              "echo \"Building and starting production containers...\"",
              "docker compose -f docker-compose.prod.yml up -d --build",
              "sleep 10",
              "curl -f http://localhost/health || exit 1",
              "echo \"✔ AxionLimit deployment succeeded and verified healthy!\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent. Command ID: $COMMAND_ID. Waiting for execution result..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          RESPONSE=$(echo "$INVOCATION" | jq -r '.ResponseCode')

          echo "Remote execution status: $STATUS"
          echo "Remote response code: $RESPONSE"

          echo "========== EC2 STANDARD OUTPUT =========="
          echo "$INVOCATION" | jq -r '.StandardOutputContent // empty'

          echo "========== EC2 STANDARD ERROR =========="
          echo "$INVOCATION" | jq -r '.StandardErrorContent // empty'

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed on EC2."
            exit 1
          fi

          echo "AxionLimit deployment succeeded and healthcheck passed!"
