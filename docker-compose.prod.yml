services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Service 1: Redis In-Memory Cache & Sliding Window Rate Limiter
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: axion-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - axion-internal

  # ─────────────────────────────────────────────────────────────────────────────
  # Service 2: Express Backend REST API (Internal only - port 5000)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: axionlimit-backend:production
    container_name: axion-backend
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
      - EC2_SERVER_NAME=${EC2_SERVER_NAME:-EC2-Mumbai}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - axion-internal

  # ─────────────────────────────────────────────────────────────────────────────
  # Service 3: Frontend Web Server & Reverse Proxy (Nginx on Port 80)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: axionlimit-frontend:production
    container_name: axion-frontend
    ports:
      - "80:80"
    # Frontend depends on backend container being present, but starts immediately
    # so Nginx serves React static files even while backend awaits MongoDB Atlas allowlist
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - axion-internal

volumes:
  redis_data:
    name: axion_redis_data

networks:
  axion-internal:
    name: axion-network
    driver: bridge
