services:
  redis:
    image: redis:alpine
    container_name: axion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MongoDB is commented out because you already have MongoDB running natively
  # on your Windows machine (port 27017). Uncomment this only if you stop your local MongoDB.
  # mongo:
  #   image: mongo:latest
  #   container_name: axion-mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
  #   restart: unless-stopped

volumes:
  redis_data:
  # mongo_data:

